[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "terp"
version = "0.1.0"
description = "TERP: population, land use, activities and traffic for Maryland (CVAE, SILO, TERP-Day, MATSim)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Raas Sarker Tomal", email = "rtomal@umd.edu" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "pyarrow", "matplotlib", "tomli; python_version < '3.11'"]

[project.optional-dependencies]
population = ["torch>=2.0", "scikit-learn", "openmatrix", "geopandas", "shapely"]
estimation = ["biogeme==3.3.5", "ipykernel", "nbformat"]
docs = ["mkdocs-material"]

[project.scripts]
terp = "terp_cli:main"

[tool.setuptools]
py-modules = ["terp_cli", "terp_env"]
