[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oriole"
version = "0.1.0"
description = "ORIOLE: population, land use, activities and traffic for Maryland (CVAE, SILO, ORIOLE-Day, MATSim)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Raas Sarker Tomal", email = "rtomal@umd.edu" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "pyarrow", "matplotlib", "tomli; python_version < '3.11'"]

[project.optional-dependencies]
population = ["torch>=2.0", "scikit-learn", "openmatrix", "geopandas", "shapely"]
estimation = ["biogeme==3.3.5", "ipykernel", "nbformat"]
docs = ["mkdocs-material"]

[project.scripts]
oriole = "oriole_cli:main"

[tool.setuptools]
py-modules = ["oriole_cli", "oriole_env"]
