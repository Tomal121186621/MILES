[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "miles"
version = "0.1.0"
description = "MILES (Maryland Integrated Land-use and Everyday-travel Simulator): population, land use, activities and traffic for Maryland (CVAE, SILO, MILES-Day, MATSim)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Raas Sarker Tomal", email = "rtomal@umd.edu" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "pyarrow", "matplotlib", "tomli; python_version < '3.11'"]

[project.optional-dependencies]
population = ["torch>=2.0", "scikit-learn", "openmatrix", "geopandas", "shapely"]
estimation = ["biogeme==3.3.5", "ipykernel", "nbformat"]
docs = ["mkdocs-material"]

[project.scripts]
miles = "miles_cli:main"

[tool.setuptools]
py-modules = ["miles_cli", "miles_env"]
